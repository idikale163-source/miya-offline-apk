name: Build Miya Offline APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIYA_KEYSTORE_BASE64: ${{ secrets.MIYA_KEYSTORE_BASE64 }}
      MIYA_KEYSTORE_PASSWORD: ${{ secrets.MIYA_KEYSTORE_PASSWORD }}
      MIYA_KEY_ALIAS: ${{ secrets.MIYA_KEY_ALIAS }}
      MIYA_KEY_PASSWORD: ${{ secrets.MIYA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # AGP 8.7.3 要求 Gradle 8.9+；配 8.11.1 稳妥。
      # 这两处是一对，改一处不改另一处必然构建失败。
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        if: ${{ env.MIYA_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$MIYA_KEYSTORE_BASE64" | base64 -d > /tmp/miya.keystore
          echo "MIYA_KEYSTORE_FILE=/tmp/miya.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Verify output
        run: |
          echo "=== 产物列表 ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: miya-offline-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miya-offline-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
